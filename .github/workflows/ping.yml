name: ping
on:
  push:
    paths: ['.github/workflows/ping.yml']
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          nproc; free -g
          echo "ok $(nproc) cores" > ping.txt
          gh release create ping-test ping.txt -R ${{ github.repository }} -t "ping" -n "$(nproc) cores" --prerelease
        env:
          GH_TOKEN: ${{ github.token }}
